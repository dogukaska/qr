<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barkod Oluştur · Dijital Çakı</title>
<meta name="theme-color" content="#efede8">
<link rel="icon" href="/icons/dijital-caki.svg">
<link rel="stylesheet" href="/tool.css?v=20261126b">
<script src="/theme.js?v=20261126c"></script>
<script src="../vendor/JsBarcode.all.min.js?v=3.12.1" defer></script>
<script type="module" src="app.js"></script>
</head>
<body><main class="tool">
<header><a class="back" href="/qr/">Araçlara dön</a>
<h1>Barkod Oluştur</h1><p class="intro">Etiket veya mevcut ürün numarası için barkod üret.</p></header>
<section class="panel">
<div class="row"><label>Biçim<select id="format"><option value="CODE128">Code 128</option><option value="EAN13">EAN‑13</option></select></label>
<label>Kod<input id="value" maxlength="80" autocomplete="off"></label></div>
<p id="status" role="status"></p>
<div id="preview" hidden><svg id="barcode" role="img" aria-label="Barkod önizlemesi"></svg>
<div class="row"><button class="primary" id="download">SVG indir</button><button id="png">PNG indir</button></div></div>
</section>
</main></body></html>
