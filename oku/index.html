<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Oku · Dijital Çakı</title>
<meta name="theme-color" content="#efede8">
<link rel="icon" href="/icons/dijital-caki.svg">
<link rel="stylesheet" href="/tool.css?v=20261126d">
<script src="/theme.js?v=20261126c"></script>
<link rel="stylesheet" href="camera.css?v=1">
<script src="../vendor/jsQR.js?v=1.4.0" defer></script>
<script type="module" src="app.js?v=2"></script>
</head>
<body><main class="tool">
<header><a class="back" href="/qr/">Araçlara dön</a>
<h1>QR Oku</h1><p class="intro">Kamerayla tara veya bir QR görseli yükle.</p></header>
<section class="panel">
<div class="row">
  <button class="primary" id="start-camera" type="button">Kamerayı aç</button>
  <button id="stop-camera" type="button" hidden>Kamerayı kapat</button>
</div>
<div class="camera-preview" id="camera-preview" hidden>
  <video id="video" autoplay muted playsinline aria-label="Canlı kamera önizlemesi"></video>
  <div class="camera-guide" aria-hidden="true"></div>
</div>
<label for="file">QR görseli</label><input id="file" type="file" accept="image/*">
<p id="status" role="status"></p>
<div id="result" hidden>
<label for="content">QR içeriği</label><textarea id="content" rows="5" readonly></textarea>
<div class="row"><button class="primary" id="copy">Kopyala</button><a class="button" id="open" rel="noopener noreferrer" target="_blank" hidden>Bağlantıyı aç</a></div>
</div></section>
</main></body></html>
